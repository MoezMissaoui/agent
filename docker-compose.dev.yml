# Développement : hot reload — Nest (backend), Vite (frontend), FastAPI (agent).
# Usage :
#   docker compose --env-file .env --env-file agent/.env -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose --env-file .env --env-file agent/.env -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Raccourci : make dev | make dev-build

services:
  backend:
    volumes:
      - ./saas/backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "if [ ! -d node_modules/@nestjs ]; then npm ci; fi && npm run start:dev"

  frontend:
    volumes:
      - ./saas/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 8548"

  agent:
    volumes:
      - ./agent/app:/app/app
      - ./agent/run.py:/app/run.py
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

volumes:
  backend_node_modules:
  frontend_node_modules:
