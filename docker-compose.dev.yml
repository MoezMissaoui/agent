# Développement : hot reload — Nest (backend), Vite (frontend), FastAPI (agent).
# Usage :
#   docker compose --env-file .env --env-file agent/.env -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose --env-file .env --env-file agent/.env -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Raccourci : make dev | make dev-build

services:
  backend:
    volumes:
      - ./saas/backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    # Réinstaller si le volume node_modules est ancien (ex. @nestjs/swagger, passport-google-oauth20, etc.)
    command: >
      sh -c "if [ ! -d node_modules/@nestjs/swagger ] || [ ! -d node_modules/express-basic-auth ] || [ ! -d node_modules/passport-google-oauth20 ]; then npm ci; fi && npm run start:dev"

  frontend:
    volumes:
      - ./saas/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    # Réinstaller les deps si le volume node_modules est ancien (ex. nouveau package comme framer-motion)
    command: >
      sh -c "if [ ! -d node_modules/vite ] || [ ! -d node_modules/framer-motion ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 8548"

  agent:
    # Bind-mount logs so YYYY-MM-DD.log appears under ./agent/logs on the host (base compose uses a named volume).
    volumes:
      - ./agent/app:/app/app
      - ./agent/run.py:/app/run.py
      - ./agent/logs:/data/logs
      - chroma_data:/data/chroma
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

volumes:
  backend_node_modules:
  frontend_node_modules:
