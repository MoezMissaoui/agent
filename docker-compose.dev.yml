# Développement : monte le code source + reload Uvicorn (pas besoin de rebuild à chaque changement .py).
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  api:
    volumes:
      - ./app:/app/app
      - ./run.py:/app/run.py
    command:
      [
        "sh",
        "-c",
        "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
